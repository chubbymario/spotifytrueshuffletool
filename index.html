<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<title>Playlist Shuffler</title>

<!--
  ============================================================================
  PLAYLIST SHUFFLER
  ============================================================================
  A single-file web app that logs into a Spotify account, lists the user's
  playlists, and PERMANENTLY reorders the tracks in a chosen playlist into a
  new random order (as opposed to Spotify's built-in "Shuffle" toggle, which
  only randomizes playback order and doesn't touch the saved playlist).

  Because it's a plain HTML/CSS/JS file, it runs the same way in any modern
  browser — Edge/Chrome on Windows 11, or Safari on an iPhone. There is no
  installer and no build step. See README.md for setup instructions,
  including why this file needs to be *hosted* (local server or a public
  URL) rather than opened directly by double-clicking it.

  No framework, no dependencies, no server-side code. Every request goes
  straight from the browser to Spotify's API using the OAuth "Authorization
  Code with PKCE" flow, which is the flow Spotify recommends for apps that
  can't safely hide a client secret (like a script running in a browser).
  Your Spotify credentials never touch anything but Spotify's own servers.

  Two things worth knowing about how the shuffle itself works:

  - Only playlists you own or collaborate on can be listed and shuffled.
    Spotify's Web API (as of its February 2026 revision) returns "403
    Forbidden" for the contents of any playlist you merely follow, so those
    are filtered out of the dropdown rather than offered and then failing.

  - Local files (tracks added from a phone or computer's own storage rather
    than Spotify's catalog) are detected automatically. Spotify's API can
    move a local file that's already in a playlist but can't add one fresh,
    so a playlist containing them is shuffled with a slower, one-move-at-a-
    time method that never removes anything — see applyShuffleViaReorder.
    Playlists with no local files use a much faster bulk-rewrite method —
    see applyShuffledOrderFast.
  ============================================================================
-->

<style>
  /* ==========================================================================
     DESIGN TOKENS
     A small, deliberate palette: deep charcoal, warm brass accent (a nod to
     old turntable hardware), muted status colors. Space Grotesk carries the
     headline personality; IBM Plex Mono is reserved for actual data — track
     counts and the activity log — not used as decoration.
     ========================================================================== */
  :root {
    --bg: #15171b;
    --panel: #1c1f24;
    --panel-raised: #22262c;
    --border: #2d3138;
    --text: #ece8e1;
    --text-dim: #8f9298;

    color: var(--text);
    font-family: var(--font-display);
    display: flex;
    align-items: center;
    justify-content: center;

  }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;

  }

  /* ---- Hero: a simple animated record. Spins only while a request is

  .record-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }
  .record {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background:
      radial-gradient(circle at center, var(--accent) 0 9%, #0e0f11 9.5% 12%,
        #1a1b1d 12.5% 20%, #0e0f11 20.5% 22%, #1a1b1d 22.5% 30%,
        #0e0f11 30.5% 32%, #1a1b1d 32.5% 100%);

  }
  .record.spinning {

<body>

<div class="card">
  <div class="record-wrap"><div class="record" id="record"></div></div>

  <h1>Playlist Shuffler</h1>
  <p class="subtitle">
    Pick a playlist and put its tracks in a new random order — permanently,
    not just for one listen.
  </p>

  <!-- ============ LOGGED-OUT VIEW ============ -->
  <div id="view-login">
    <button class="btn-primary" id="btn-login">Connect Spotify</button>
  </div>

  <!-- ============ LOGGED-IN VIEW ============ -->
  <div id="view-app" class="hidden">
    <div class="status-row">
      <span>Signed in as <strong id="user-name">—</strong></span>
    </div>

    <div class="field">
      <label for="playlist-select">Playlist</label>
      <select id="playlist-select"></select>
    </div>

    <button class="btn-primary" id="btn-shuffle">Shuffle playlist</button>

    <div class="log hidden" id="log"></div>

    <div class="footer-row">
      <button class="btn-secondary" id="btn-logout">Log out</button>
    </div>
  </div>
</div>

<script>
/* ============================================================================
   CONFIGURATION — edit this section for your own Spotify app
   ============================================================================ */

// Paste the Client ID from your Spotify Developer Dashboard app here.
// This is a public identifier, not a secret — it's fine for it to live in
// client-side code. See README.md, Step 1, for how to create the app.
const CLIENT_ID = '083e7316708940a09bd7b115f20591e9';

// Auto-detected from wherever this file is actually being served. Whatever
// URL this resolves to MUST be added, character-for-character, to
// "Redirect URIs" in your Spotify app settings. See README.md, Step 4.
const REDIRECT_URI = window.location.origin + window.location.pathname;

// Permissions we ask the user to grant. We only request what the tool
// actually needs: reading playlists (to list and read them) and modifying
// playlists (to write the new track order back).
const SCOPES = [
  'playlist-read-private',
  'playlist-read-collaborative',
  'playlist-modify-public',
  'playlist-modify-private'
].join(' ');

/* ============================================================================
   PKCE HELPERS
   PKCE ("Proof Key for Code Exchange") lets a browser-only app prove to
   Spotify that the app which starts the login and the app which finishes it
   are the same one, without ever holding a client secret. In short:
     1. We generate a random secret ("verifier") and keep it to ourselves.
     2. We send Spotify a hash of it ("challenge") when starting login.
     3. We send Spotify the original verifier when finishing login.
     4. Spotify checks the hash matches before issuing an access token.
   ============================================================================ */

// A random string used as the PKCE verifier and as an anti-tampering "state"
// value. crypto.getRandomValues is a cryptographically strong source of
// randomness built into every modern browser.
function generateRandomString(length) {
  const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  const randomValues = crypto.getRandomValues(new Uint8Array(length));
  let text = '';
  randomValues.forEach(v => { text += possible[v % possible.length]; });
  return text;
}

// SHA-256 hash of a string, using the browser's built-in Web Crypto API.
async function sha256(plain) {
  const data = new TextEncoder().encode(plain);
  return crypto.subtle.digest('SHA-256', data);
}

// Base64url-encode a hash (Spotify requires the URL-safe variant of base64:
// '+' -> '-', '/' -> '_', and no trailing '=' padding).
function base64UrlEncode(buffer) {
  let str = '';
  new Uint8Array(buffer).forEach(b => { str += String.fromCharCode(b); });
  return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function generateCodeChallenge(verifier) {
  return base64UrlEncode(await sha256(verifier));
}

/* ============================================================================
   AUTHENTICATION
   ============================================================================ */

// Kicks off login: builds the PKCE pair, remembers the verifier for later
// (sessionStorage survives the full-page redirect to Spotify and back, but
// clears when the tab closes), then sends the browser to Spotify's login
// and consent screen.
async function login() {
  const verifier = generateRandomString(64);
  const challenge = await generateCodeChallenge(verifier);
  const state = generateRandomString(16);

  sessionStorage.setItem('pkce_verifier', verifier);
  sessionStorage.setItem('pkce_state', state);

  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    code_challenge_method: 'S256',
    code_challenge: challenge,
    state
  });

  window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
}

// Called once on every page load. If the URL contains the "code" and
// "state" params Spotify adds after login, this exchanges that code for an
// access token and cleans the URL back up. If there's no code, it's a no-op
// (e.g. the user is just revisiting the page normally).
async function handleRedirect() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const state = params.get('state');
  const authError = params.get('error');

  if (authError) {
    showError('Spotify sign-in was cancelled or denied.');
    window.history.replaceState({}, document.title, REDIRECT_URI);
    return;
  }
  if (!code) return;

  const expectedState = sessionStorage.getItem('pkce_state');
  if (!expectedState || state !== expectedState) {
    showError('Login could not be verified (state mismatch). Please try again.');
    window.history.replaceState({}, document.title, REDIRECT_URI);
    return;
  }

  const verifier = sessionStorage.getItem('pkce_verifier');
  const body = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: 'authorization_code',
    code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });

  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body
  });

  // Always scrub the code/state out of the visible URL, whether or not the
  // exchange succeeded, so a page refresh can't try to reuse a spent code.
  window.history.replaceState({}, document.title, REDIRECT_URI);

  if (!res.ok) {
    showError('Could not complete sign-in. Double-check CLIENT_ID and Redirect URI (see README.md).');
    return;
  }
  storeTokens(await res.json());
}

// Saves the tokens Spotify issued. expires_at is stored as an absolute
// timestamp so we can tell later whether the access token has gone stale.
function storeTokens({ access_token, refresh_token, expires_in }) {
  sessionStorage.setItem('access_token', access_token);
  if (refresh_token) sessionStorage.setItem('refresh_token', refresh_token);
  sessionStorage.setItem('expires_at', String(Date.now() + expires_in * 1000));
}

// Access tokens expire after an hour. If we have a refresh token, this
// silently gets a new access token without asking the user to log in again.
async function refreshAccessToken() {
  const refresh_token = sessionStorage.getItem('refresh_token');
  if (!refresh_token) return false;

  const body = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: 'refresh_token',
    refresh_token
  });

  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body
  });
  if (!res.ok) return false;

  const data = await res.json();
  // Spotify doesn't always issue a new refresh token on refresh; keep the
  // old one in that case.
  storeTokens({ ...data, refresh_token: data.refresh_token || refresh_token });
  return true;
}

// Returns a definitely-valid access token, refreshing first if the current
// one is expired or about to expire in the next 30 seconds.
async function getValidAccessToken() {
  const expiresAt = Number(sessionStorage.getItem('expires_at') || 0);
  if (Date.now() > expiresAt - 30000) {
    const ok = await refreshAccessToken();
    if (!ok) return null;
  }
  return sessionStorage.getItem('access_token');
}

function isLoggedIn() {
  return Boolean(sessionStorage.getItem('refresh_token'));
}

function logout() {
  sessionStorage.clear();
  location.reload();
}

/* ============================================================================
   SPOTIFY WEB API

   Spotify's February 2026 Web API revision renamed the playlist-contents
   endpoints from "/tracks" to "/items" (GET/POST/PUT/DELETE alike), and the
   old "/tracks" paths now reject requests outright. It also tightened access:
   reading or editing a playlist's contents now requires being its owner or
   a collaborator — playlists you merely follow return 403 Forbidden. Every
   call below targets the current "/items" endpoints and the code filters
   the playlist list accordingly (see showLoggedInView).
   ============================================================================ */

// Set once the user is logged in, so playlists can be checked against
// "do I own this one?" (see showLoggedInView).
let currentUserId = null;


// A thin wrapper around fetch() that: attaches the access token, retries
// once after a silent token refresh if the token turned out to be expired
// (401), and waits and retries if Spotify's rate limiter kicks in (429).
async function spotifyFetch(path, options = {}) {
  const token = await getValidAccessToken();
  if (!token) throw new Error('Not signed in.');

  const url = path.startsWith('http') ? path : `https://api.spotify.com/v1${path}`;
  const res = await fetch(url, {
    ...options,
    headers: {
      Authorization: `Bearer ${token}`,
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  });

  if (res.status === 429) {
    const waitSeconds = Number(res.headers.get('Retry-After') || 1);
    await new Promise(r => setTimeout(r, (waitSeconds + 0.5) * 1000));
    return spotifyFetch(path, options);
  }

  if (res.status === 401) {
    const refreshed = await refreshAccessToken();
    if (refreshed) return spotifyFetch(path, options);
    throw new Error('Your session expired. Please log in again.');
  }

  if (!res.ok) {
    const errBody = await res.json().catch(() => ({}));
    if (res.status === 403) {
      throw new Error(errBody.error?.message || 'Spotify refused this action (403 Forbidden) — this usually means the playlist isn\'t one you own or collaborate on.');
    }
    throw new Error(errBody.error?.message || `Spotify API error (HTTP ${res.status})`);
  }

  return res.status === 204 ? null : res.json();
}

async function fetchCurrentUser() {
  return spotifyFetch('/me');
}

// Playlists are returned 50 at a time; follow the "next" link Spotify gives
// back until there isn't one, to collect the full list.
async function fetchAllPlaylists() {
  let items = [];
  let url = '/me/playlists?limit=50';
  while (url) {
    const data = await spotifyFetch(url);
    // Spotify occasionally includes a null entry in this list — typically a
    // playlist you still "follow" that its owner has since deleted. There's
    // nothing to shuffle there, so drop anything that isn't a real object.
    items = items.concat(data.items.filter(Boolean));
    url = data.next;
  }
  return items;
}

// Reads every item in a playlist via the current "/items" endpoint (the old
// "/tracks" endpoint this used to call now rejects requests). We ask only
// for the fields we need — each item's URI and whether it's a local file —
// to keep responses small. `is_local` matters: see fetchAllTrackItems's
// caller for why.
async function fetchAllTrackItems(playlistId) {
  const results = [];
  let url = `/playlists/${playlistId}/items?` + new URLSearchParams({
    fields: 'items(is_local,item(uri)),next',
    limit: '100'
  });
  while (url) {
    const data = await spotifyFetch(url);
    for (const entry of data.items) {
      const uri = entry.item && entry.item.uri;
      // A missing URI can happen if a track was pulled from Spotify's
      // catalog entirely; skip it since there's nothing left to reorder.
      if (!uri) continue;
      results.push({ uri, isLocal: Boolean(entry.is_local) });
    }
    url = data.next;
  }
  return results;
}

// The Fisher–Yates shuffle: the standard algorithm for producing a random
// permutation of a list where every ordering is equally likely.
function shuffleArray(array) {
  const result = array.slice();
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

// Turns a shuffled list of URIs into a fast rewrite of the whole playlist.
// The "replace playlist items" endpoint only accepts up to 100 URIs per call
// and, importantly, REPLACES the whole playlist with whatever you send — so
// we use it once for the first 100 tracks, then switch to "add items"
// (append) for every subsequent batch of up to 100, in order.
//
// IMPORTANT: this only works when the playlist has no local files. Spotify's
// API cannot *add* a local-file URI (only move or remove an existing one —
// see the docs on local files), and replace/append is really "remove
// everything, then add it all back" from the API's point of view. Using this
// path on a playlist with local files would silently drop them. The caller
// (onShuffleClick) checks for that and picks applyShuffleViaReorder instead
// when any local files are present.
async function applyShuffledOrderFast(playlistId, uris, onProgress) {
  const CHUNK_SIZE = 100;
  const firstChunk = uris.slice(0, CHUNK_SIZE);

  await spotifyFetch(`/playlists/${playlistId}/items`, {
    method: 'PUT',
    body: JSON.stringify({ uris: firstChunk })
  });
  onProgress(firstChunk.length, uris.length);

  for (let i = CHUNK_SIZE; i < uris.length; i += CHUNK_SIZE) {
    const chunk = uris.slice(i, i + CHUNK_SIZE);
    await spotifyFetch(`/playlists/${playlistId}/items`, {
      method: 'POST',
      body: JSON.stringify({ uris: chunk })
    });
    onProgress(Math.min(i + CHUNK_SIZE, uris.length), uris.length);
  }
}

// Produces a random permutation of the indices 0..n-1 (i.e. "track originally
// at index 7 should now go first", etc.) using the same Fisher–Yates logic
// as shuffleArray, just applied to positions instead of the URIs themselves.
// Keeping the permutation as indices (rather than shuffling URIs directly)
// is what lets applyShuffleViaReorder figure out which physical item to move
// where, without caring what a "local" URI even looks like.
function shufflePermutation(length) {
  return shuffleArray(Array.from({ length }, (_, i) => i));
}

// Reorders a playlist's items in place — one "move this single item"
// request per track that isn't already where it needs to be — instead of
// replacing the playlist's contents. This is slower (up to one API call per
// track, versus one call per 100 for applyShuffledOrderFast) but never
// removes or re-adds anything, which is what makes it safe for playlists
// containing local files: Spotify's API can reorder a local file that's
// already in a playlist, it just can't be asked to (re-)add one.
//
// The approach is a standard in-place "selection sort": for each target
// position i (left to right), find whichever track should end up there,
// and — if it isn't already there — move it directly into place with one
// reorder call. `current` tracks our own model of the playlist's order so
// we know where to look next, without having to re-fetch after every move.
async function applyShuffleViaReorder(playlistId, targetOrder, onProgress) {
  const total = targetOrder.length;
  let current = targetOrder.map((_, i) => i); // starts as the original order: [0, 1, 2, ...]

  for (let i = 0; i < total - 1; i++) {
    const wantOriginalIndex = targetOrder[i];
    let j = i;
    while (current[j] !== wantOriginalIndex) j++;

    if (j !== i) {
      // Move the single item at position j to position i. Since j > i here,
      // Spotify's insert_before is simply i (see the API reference: moving
      // an item to an EARLIER position uses that position directly, with no
      // off-by-one — the +1 adjustment only applies when moving something
      // later in the list, which this algorithm never needs to do).
      await spotifyFetch(`/playlists/${playlistId}/items`, {
        method: 'PUT',
        body: JSON.stringify({ range_start: j, range_length: 1, insert_before: i })
      });
      const [moved] = current.splice(j, 1);
      current.splice(i, 0, moved);
    }
    onProgress(i + 1, total);
  }
}

/* ============================================================================
   UI WIRING
   ============================================================================ */

const el = id => document.getElementById(id);

function setSpinning(on) {
  el('record').classList.toggle('spinning', on);
}

function log(message, kind) {
  const logEl = el('log');
  logEl.classList.remove('hidden');
  const line = document.createElement('div');
  if (kind) line.className = kind;
  const time = new Date().toLocaleTimeString([], { hour12: false });
  line.textContent = `[${time}] ${message}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function showError(message) {
  log(message, 'error');
}

async function showLoggedInView() {
  el('view-login').classList.add('hidden');
  el('view-app').classList.remove('hidden');

  try {
    const me = await fetchCurrentUser();
    currentUserId = me.id;
    el('user-name').textContent = me.display_name || me.id;

    setSpinning(true);
    const allPlaylists = await fetchAllPlaylists();
    setSpinning(false);

    // Spotify's playlist-contents endpoints now return 403 Forbidden for
    // any playlist you merely follow rather than own or collaborate on
    // (e.g. a friend's playlist, or an official Spotify playlist saved to
    // your library). There's nothing this tool could do with those, so
    // they're left out of the list rather than offered and then failing.
    const editable = allPlaylists.filter(p => p.owner?.id === currentUserId || p.collaborative);
    const hiddenCount = allPlaylists.length - editable.length;

    const select = el('playlist-select');
    select.innerHTML = '';
    for (const p of editable) {
      const opt = document.createElement('option');
      opt.value = p.id;
      // Spotify's Feb 2026 revision renamed this summary field from
      // "tracks" to "items"; both are sent for now, so prefer the new one
      // but fall back to the old one, then to '?' if neither is present.
      const total = p.items?.total ?? p.tracks?.total ?? '?';
      const name = p.name || '(untitled playlist)';
      opt.textContent = `${name} (${total} tracks)`;
      select.appendChild(opt);
    }

    if (hiddenCount > 0) {
      log(`${hiddenCount} playlist(s) you follow but don't own or collaborate on aren't shown — Spotify only allows edits to your own or collaborative playlists.`);
    }
    if (editable.length === 0) {
      const opt = document.createElement('option');
      opt.textContent = 'No editable playlists found on this account';
      select.appendChild(opt);
      el('btn-shuffle').disabled = true;
    }
  } catch (err) {
    setSpinning(false);
    showError(err.message);
  }
}

async function onShuffleClick() {
  const select = el('playlist-select');
  const playlistId = select.value;
  const playlistName = select.options[select.selectedIndex]?.textContent || playlistId;
  if (!playlistId) return;

  el('btn-shuffle').disabled = true;
  setSpinning(true);
  log(`Reading tracks from "${playlistName}"...`);

  try {
    const items = await fetchAllTrackItems(playlistId);
    if (items.length < 2) {
      log('Not enough tracks to shuffle.', 'error');
      return;
    }

    const localCount = items.filter(it => it.isLocal).length;
    const targetOrder = shufflePermutation(items.length); // e.g. [3,0,2,1,...]

    if (localCount > 0) {
      // Local files (added from a phone or computer's own storage rather
      // than Spotify's catalog) can be reordered but not re-added — see
      // fetchAllTrackItems / applyShuffledOrderFast for why. Moving items
      // one at a time keeps them exactly where the shuffle puts them
      // instead of silently dropping them.
      log(`Found ${localCount} local file${localCount === 1 ? '' : 's'} in this playlist — using the slower move-by-move method so they're preserved (Spotify's API can reorder local files, but can't re-add them).`);
      if (items.length > 250) {
        log(`${items.length} tracks total — this method makes roughly one request per track, so it may take a little while.`);
      }
      await applyShuffleViaReorder(playlistId, targetOrder, (done, total) => {
        log(`Moving tracks into place: ${done} / ${total}`);
      });
    } else {
      log(`Shuffling ${items.length} tracks...`);
      const shuffledUris = targetOrder.map(originalIndex => items[originalIndex].uri);
      await applyShuffledOrderFast(playlistId, shuffledUris, (done, total) => {
        log(`Saving new order: ${done} / ${total}`);
      });
    }

    log(`Done — "${playlistName}" is now in a new random order.`, 'success');
  } catch (err) {
    showError(err.message);
  } finally {
    setSpinning(false);
    el('btn-shuffle').disabled = false;
  }
}

/* ============================================================================
   STARTUP
   ============================================================================ */

async function init() {
  if (CLIENT_ID === 'PASTE_YOUR_SPOTIFY_CLIENT_ID_HERE') {
    document.querySelector('.subtitle').innerHTML =
      'Setup needed: open <code>index.html</code> and paste your Spotify ' +
      'Client ID into the CLIENT_ID constant. See README.md.';
    el('btn-login').disabled = true;
    return;
  }

  await handleRedirect();

  if (isLoggedIn()) {
    showLoggedInView();
  } else {
    el('view-login').classList.remove('hidden');
  }
}

el('btn-login').addEventListener('click', login);
el('btn-logout').addEventListener('click', logout);
el('btn-shuffle').addEventListener('click', onShuffleClick);

init();
</script>
